<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Examination Schedule</title>
<script>
(function () {
    function show(m) {
        var d = document.getElementById('fatal');
        if (!d) {
            d = document.createElement('div'); d.id = 'fatal';
            d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#b00020;color:#fff;padding:12px 16px;font:600 14px Inter,Arial,sans-serif;line-height:1.4';
            (document.body || document.documentElement).appendChild(d);
        }
        d.textContent = '\u26A0 ' + m;
    }
    window.__showFatal = show;
    window.addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'SCRIPT') { show('Could not load ' + e.target.getAttribute('src') + '. Upload it next to this page, then hard-refresh (Ctrl+F5).'); }
        else if (e.message) { show('Page error: ' + e.message + '. Make sure exams.js (latest) and the admit_cards folder are uploaded next to this page, then hard-refresh (Ctrl+F5).'); }
    }, true);
})();
</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(22, 28, 45, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #00f2ff;
            --accent-gradient: linear-gradient(135deg, #00f2ff, #0066ff);
            --expired: #ff4757;
            --success: #2ed573;
            --warning: #ff9f43;
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); min-height: 100vh; padding: 40px 20px; line-height: 1.6; }
        .container { max-width: 1050px; margin: 0 auto; }
        .header-title { text-align: center; font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 30px; background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

        .glass-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--card-border); border-radius: 16px; padding: 24px; margin-bottom: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; color: var(--text-muted); gap: 10px; flex-wrap: wrap; }
        .progress-bar-bg { width: 100%; height: 10px; background: rgba(255,255,255,0.05); border-radius: 20px; overflow: hidden; border: 1px solid var(--card-border); }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00f2ff, #2ed573); box-shadow: 0 0 12px rgba(0,242,255,0.4); transition: width .8s ease-in-out; }

        .alert { background: rgba(255,71,87,0.12); border: 1px solid rgba(255,71,87,0.45); border-left: 4px solid var(--expired); border-radius: 12px; padding: 14px 18px; margin-bottom: 24px; font-size: 0.88rem; }
        .alert strong { color: var(--expired); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; font-size: .8rem; }
        .alert[hidden] { display: none; }

        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
        .pill { background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--card-border); padding: 7px 16px; border-radius: 20px; font-size: .8rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .2s ease; }
        .pill:hover { color: #fff; border-color: var(--accent); }
        .pill.active { background: rgba(0,242,255,0.12); color: var(--accent); border-color: rgba(0,242,255,0.4); }
        .spacer { flex: 1; }

        .table-wrapper { overflow-x: auto; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 20px 40px rgba(0,0,0,0.4); margin-bottom: 24px; }
        table { width: 100%; border-collapse: collapse; background: var(--card-bg); backdrop-filter: blur(12px); text-align: left; }
        th, td { padding: 14px 18px; font-size: 0.88rem; vertical-align: top; }
        th { background: rgba(0,0,0,0.4); color: var(--accent); text-transform: uppercase; font-size: 0.74rem; letter-spacing: 1.2px; border-bottom: 1px solid var(--card-border); white-space: nowrap; }
        td { color: var(--text-main); border-bottom: 1px solid var(--card-border); transition: background .2s ease; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover:not(.completed-row) { background: rgba(255,255,255,0.03); }
        .completed-row td:not(:last-child) { text-decoration: line-through; color: rgba(255,255,255,0.25) !important; }
        .clash-row { background: rgba(255,71,87,0.07); }
        .sub { display: block; font-size: 0.75rem; color: var(--text-muted); }
        .nowrap { white-space: nowrap; }

        .prog { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; display: inline-block; }
        .prog.bca { color: var(--accent); background: rgba(0,242,255,.08); border: 1px solid rgba(0,242,255,.25); }
        .prog.pharm { color: var(--success); background: rgba(46,213,115,.08); border: 1px solid rgba(46,213,115,.25); }

        .status-badge { font-size: 0.72rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; display: inline-flex; align-items: center; gap: 5px; text-decoration: none !important; white-space: nowrap; }
        .status-active { background: rgba(0,242,255,0.1); color: var(--accent); border: 1px solid rgba(0,242,255,0.2); }
        .status-live { background: rgba(255,159,67,0.12); color: var(--warning); border: 1px solid rgba(255,159,67,0.3); }
        .status-done { background: rgba(255,71,87,0.1); color: var(--expired); border: 1px solid rgba(255,71,87,0.2); }
        .clash-note { display: block; margin-top: 6px; font-size: .7rem; font-weight: 700; color: var(--expired); }

        details { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 4px 18px; margin-bottom: 24px; }
        summary { cursor: pointer; padding: 14px 0; font-weight: 600; color: var(--accent); font-size: .9rem; }
        details table { background: transparent; }
        .mine td { background: rgba(46,213,115,0.08); font-weight: 600; }


        .section-title { font-size: 1.05rem; font-weight: 700; margin: 8px 0 14px; color: var(--text-main); letter-spacing: .3px; }
        .ac-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; margin-bottom: 30px; }
        .ac-card { background: var(--card-bg); border: 1px solid var(--card-border); border-top: 4px solid var(--accent); border-radius: 16px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 14px; }
        .ac-card.pharm { border-top-color: var(--success); }
        .ac-title { font-size: 1rem; font-weight: 700; }
        .ac-card dl > div { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--card-border); font-size: .82rem; }
        .ac-card dl > div:last-child { border-bottom: none; }
        .ac-card dt { flex: 0 0 120px; color: var(--text-muted); }
        .ac-card dd { flex: 1; font-weight: 500; word-break: break-word; }
        .ac-sub { font-size: .72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 700; margin-bottom: 6px; }
        .ac-papers { list-style: none; font-size: .85rem; }
        .ac-papers li { padding: 4px 0; }
        .ac-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { background: rgba(255,255,255,.06); color: var(--text-main); border: 1px solid var(--card-border); padding: 8px 14px; border-radius: 10px; font-size: .8rem; font-weight: 600; cursor: pointer; text-decoration: none; font-family: inherit; transition: all .2s ease; display: inline-flex; align-items: center; gap: 6px; }
        .btn:hover { border-color: var(--accent); color: #fff; }
        .btn.primary { background: var(--accent-gradient); color: #001018; border: none; }
        .btn.primary:hover { opacity: .88; color: #001018; }
        .ac-hint { font-size: .72rem; color: var(--text-muted); }
        .ac-preview iframe { width: 100%; height: 520px; border: 1px solid var(--card-border); border-radius: 10px; background: #fff; }
        .prep { display: flex; gap: 8px; align-items: flex-start; font-size: .82rem; margin-bottom: 6px; cursor: pointer; }
        .prep input { accent-color: var(--success); margin-top: 4px; }

        .glance { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 30px; }
        .gl { background: rgba(255,71,87,.07); border: 1px solid rgba(255,71,87,.3); border-radius: 12px; padding: 14px; font-size: .82rem; }
        .gl b { display: block; font-size: .88rem; margin: 4px 0 2px; }
        .gl span.ic { font-size: 1.3rem; }
        .gl p { color: var(--text-muted); }

        .ins-block { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 18px 20px; margin-bottom: 20px; }
        .ins-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; font-weight: 700; font-size: .92rem; }
        .ins-count { font-size: .75rem; color: var(--text-muted); font-weight: 600; }
        .ins-list { list-style: none; }
        .ins { display: flex; gap: 12px; padding: 12px 10px; border-bottom: 1px solid var(--card-border); font-size: .88rem; align-items: flex-start; border-radius: 8px; }
        .ins:last-child { border-bottom: none; }
        .ins input { accent-color: var(--success); margin-top: 5px; width: 17px; height: 17px; flex: 0 0 auto; }
        .ins.imp { background: rgba(255,71,87,.06); border-left: 3px solid var(--expired); }
        .ins.na { opacity: .55; }
        .ins.done .txt { color: var(--text-muted); }
        .ins .no { font-weight: 700; color: var(--accent); min-width: 22px; }
        .tag { font-size: .65rem; font-weight: 800; letter-spacing: .6px; padding: 2px 8px; border-radius: 20px; margin-right: 8px; text-transform: uppercase; white-space: nowrap; vertical-align: 1px; }
        .tag.imp { background: rgba(255,71,87,.18); color: var(--expired); border: 1px solid rgba(255,71,87,.4); }
        .tag.na { background: rgba(255,255,255,.08); color: var(--text-muted); border: 1px solid var(--card-border); }
        .txt b { color: #fff; }
        .ins.imp .txt b { color: #ffd1d6; }
        @media print { .ac-preview, .ac-actions, .prep input, .ins input { display: none !important; } .ac-card, .ins-block, .gl { background: #fff; color: #000; border-color: #999; box-shadow: none; } .txt b, .ins.imp .txt b { color: #000; } .section-title { color: #000; } }

        .back-link { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; margin-top: 8px; color: var(--accent); text-decoration: none; font-weight: 600; border-radius: 12px; background: var(--card-bg); border: 1px solid var(--card-border); transition: all .3s ease; }
        .back-link:hover { background: rgba(0,242,255,0.1); border-color: var(--accent); transform: translateY(-2px); }

        @media print {
            body { background: #fff; color: #000; padding: 10px; }
            .toolbar, .back-link, .progress-bar-bg { display: none !important; }
            .glass-card, .table-wrapper, details, .alert { box-shadow: none; background: #fff; border-color: #999; }
            th { color: #000; background: #eee; }
            td, .sub { color: #000 !important; }
            .header-title { -webkit-text-fill-color: #000; color: #000; background: none; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="header-title">Examination Schedule</h1>

    <div class="glass-card">
        <div class="progress-header">
            <span>Course Completion Status</span>
            <span id="progress-text">0% Completed</span>
        </div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
    </div>

    <div class="alert" id="clashAlert" hidden></div>

    <div class="toolbar">
        <button class="pill active" data-prog="all">All</button>
        <button class="pill" data-prog="bca">BCA · IGNOU</button>
        <button class="pill" data-prog="pharm">Pharmacy · PSBTE</button>
        <span class="spacer"></span>
        <button class="pill" id="btnIcs">📅 Download .ics</button>
        <button class="pill" id="btnPrint">🖨 Print</button>
    </div>

    <div class="table-wrapper">
        <table id="exam-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Day</th>
                    <th>Time</th>
                    <th>Subject Code</th>
                    <th>Programme</th>
                    <th>Exam Centre</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <section id="admitCards">
        <h2 class="section-title">🎫 My Admit Cards</h2>
        <div class="ac-grid" id="acGrid"></div>

        <h2 class="section-title">📌 Read this first — key points</h2>
        <div class="glance" id="glance"></div>

        <h2 class="section-title">📋 Instructions from your admit cards</h2>
        <div class="toolbar">
            <button class="pill active" data-ins="all">All instructions</button>
            <button class="pill" data-ins="imp">Important only</button>
            <span class="spacer"></span>
            <button class="pill" id="btnMarkAll">✔ Mark all as read</button>
            <button class="pill" id="btnResetAll">Reset</button>
        </div>
        <div id="insWrap"></div>
    </section>

    <a href="index.html" class="back-link">← Return to Master Vault</a>
</div>

<script src="exams.js?v=3"></script>
<script>
(function () {
    'use strict';
    if (!window.VAULT || window.VAULT.VERSION < 3 || !window.VAULT.ADMIT_CARDS) {
        window.__showFatal('exams.js is missing or outdated. Upload the latest exams.js (same folder as this page) and hard-refresh with Ctrl+F5.');
        return;
    }
    const V = window.VAULT;
    const body = document.getElementById('table-body');
    const exams = V.sorted();
    const clashList = V.clashes();
    let filter = 'all';

    function rowHTML(e, st, clashWith) {
        const p = V.PROGRAMS[e.program];
        const badge = st === 'completed'
            ? '<span class="status-badge status-done">Completed 🏁</span>'
            : st === 'live'
                ? '<span class="status-badge status-live">In Progress</span>'
                : '<span class="status-badge status-active">Pending</span>';
        const note = clashWith.length ? `<span class="clash-note">⚠ Clashes with ${clashWith.map(V.label).join(', ')}</span>` : '';
        const reach = p.reportMin ? `<span class="sub">Reach by ${V.fmt12(V.shiftTime(e.start, -p.reportMin))}</span>` : '';
        return `<tr class="${st === 'completed' ? 'completed-row' : ''} ${clashWith.length ? 'clash-row' : ''}" data-program="${e.program}">
            <td class="nowrap">${V.fmtDate(e.date)}</td>
            <td>${V.dayName(e.date)}</td>
            <td class="nowrap">${V.timeRange(e)}${reach}</td>
            <td><b>${e.code}</b>${e.name ? `<span class="sub">${e.name}</span>` : ''}</td>
            <td><span class="prog ${e.program}">${p.label}</span><span class="sub">${e.cls}</span></td>
            <td>${p.centre}<a class="sub" style="color:var(--warning)" href="${p.map}" target="_blank" rel="noopener">Open in Maps ↗</a></td>
            <td>${badge}${note}</td>
        </tr>`;
    }

    function render() {
        const now = new Date();
        const items = exams.map(e => ({
            e, st: V.status(e, now),
            clash: clashList.filter(pair => pair.includes(e) && !pair.some(x => V.status(x, now) === 'completed')).map(pair => pair.find(x => x !== e))
        }));
        const active = items.filter(i => i.st !== 'completed');
        const done = items.filter(i => i.st === 'completed');
        const ordered = active.concat(done).filter(i => filter === 'all' || i.e.program === filter);
        body.innerHTML = ordered.map(i => rowHTML(i.e, i.st, i.clash)).join('');

        const total = items.length, completed = done.length;
        const pct = total ? Math.round(completed / total * 100) : 0;
        document.getElementById('progress-fill').style.width = pct + '%';
        document.getElementById('progress-text').textContent = `${pct}% Completed (${total - completed} Remaining)`;

        const box = document.getElementById('clashAlert');
        const live = clashList.filter(([a, b]) => V.status(a, now) !== 'completed' && V.status(b, now) !== 'completed');
        if (live.length) {
            box.hidden = false;
            box.innerHTML = '<strong>⚠ Timetable clash detected</strong>' + live.map(([a, b]) =>
                `<div>${V.fmtDate(a.date)}: ${V.label(a)} (${V.timeRange(a)}) overlaps ${V.label(b)} (${V.timeRange(b)}). Contact your institute / IGNOU Regional Centre.</div>`).join('');
        } else box.hidden = true;
    }



    // ---------- Admit cards & instructions ----------
    const AC = V.ADMIT_CARDS, store = V.store;
    const $ = id => document.getElementById(id);
    let onlyImp = false;

    function renderAdmitCards() {
        $('acGrid').innerHTML = Object.keys(AC).map(k => {
            const a = AC[k], p = V.PROGRAMS[k];
            const papers = V.sorted().filter(e => e.program === k).map(e =>
                `<li><b>${e.code}</b>${e.name ? ' · ' + e.name : ''}<span class="sub">${V.fmtDate(e.date)} · ${V.dayName(e.date)} · ${V.timeRange(e)}</span></li>`).join('');
            const rows = a.details.map(([l, v]) => `<div><dt>${l}</dt><dd>${v}</dd></div>`).join('');
            const prep = a.before.map((t, i) =>
                `<label class="prep"><input type="checkbox" data-prep="${k}:${i}" ${store.get(`ac_${k}_${i}`) === 'true' ? 'checked' : ''}><span>${t}</span></label>`).join('');
            return `<article class="ac-card ${k}">
                <div><span class="prog ${k}">${p.label}</span></div>
                <div class="ac-title">${a.title}</div>
                <dl>${rows}</dl>
                <div><div class="ac-sub">Papers on this card</div><ul class="ac-papers">${papers}</ul></div>
                <div class="ac-actions">
                    <a class="btn primary" href="${a.file}" download="${a.downloadName}">⬇ Download PDF</a>
                    <a class="btn" href="${a.file}" target="_blank" rel="noopener">👁 Open in new tab</a>
                    <button class="btn" data-preview="${k}">🔍 Preview here</button>
                </div>
                <div class="ac-hint">If the download does not start, make sure the <b>admit_cards</b> folder sits next to this page.</div>
                <div class="ac-preview" id="prev-${k}"></div>
                <div><div class="ac-sub">Before exam day — tick when done</div>${prep}</div>
            </article>`;
        }).join('');
    }

    function renderGlance() {
        $('glance').innerHTML = V.GLANCE.map(g =>
            `<div class="gl"><span class="ic">${g.icon}</span><b>${g.title}</b><p>${g.text}</p></div>`).join('');
    }

    function renderInstructions() {
        $('insWrap').innerHTML = Object.keys(AC).map(k => {
            const a = AC[k], p = V.PROGRAMS[k];
            const applicable = a.instructions.filter(x => !x.na);
            const read = a.instructions.filter((x, i) => !x.na && store.get(`ins_${k}_${i}`) === 'true').length;
            let n = 0;
            const items = a.instructions.map((x, i) => {
                const num = ++n;
                if (onlyImp && !x.imp) return '';
                const done = store.get(`ins_${k}_${i}`) === 'true';
                const tag = x.na ? '<span class="tag na">Not applicable</span>' : x.imp ? '<span class="tag imp">Important</span>' : '';
                return `<li class="ins ${x.imp ? 'imp' : ''} ${x.na ? 'na' : ''} ${done ? 'done' : ''}">
                    <span class="no">${num}.</span>
                    ${x.na ? '' : `<input type="checkbox" data-read="${k}:${i}" ${done ? 'checked' : ''} title="Mark as read">`}
                    <div class="txt">${tag}${x.t}</div></li>`;
            }).join('');
            return `<div class="ins-block"><div class="ins-head"><span>${p.label} — ${a.title}</span>
                <span class="ins-count">${read}/${applicable.length} read</span></div>
                <ul class="ins-list">${items}</ul></div>`;
        }).join('');
    }

    function setAll(val) {
        Object.keys(AC).forEach(k => AC[k].instructions.forEach((x, i) => { if (!x.na) store.set(`ins_${k}_${i}`, val); }));
        renderInstructions();
    }

    document.addEventListener('click', ev => {
        const t = ev.target;
        if (t.dataset && t.dataset.preview) {
            const k = t.dataset.preview, box = $('prev-' + k);
            if (box.innerHTML) { box.innerHTML = ''; t.textContent = '🔍 Preview here'; }
            else { box.innerHTML = `<iframe src="${AC[k].file}" title="${AC[k].title}"></iframe>`; t.textContent = '✖ Close preview'; }
        } else if (t.dataset && t.dataset.ins) {
            document.querySelectorAll('.pill[data-ins]').forEach(b => b.classList.toggle('active', b === t));
            onlyImp = t.dataset.ins === 'imp';
            renderInstructions();
        } else if (t.id === 'btnMarkAll') setAll('true');
        else if (t.id === 'btnResetAll') setAll('false');
    });
    document.addEventListener('change', ev => {
        const t = ev.target;
        if (t.dataset && t.dataset.read) {
            const [k, i] = t.dataset.read.split(':');
            store.set(`ins_${k}_${i}`, t.checked);
            renderInstructions();
        } else if (t.dataset && t.dataset.prep) {
            const [k, i] = t.dataset.prep.split(':');
            store.set(`ac_${k}_${i}`, t.checked);
        }
    });

    renderAdmitCards();
    renderGlance();
    renderInstructions();

    document.querySelectorAll('.pill[data-prog]').forEach(btn => btn.addEventListener('click', () => {
        document.querySelectorAll('.pill[data-prog]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filter = btn.dataset.prog;
        render();
    }));
    document.getElementById('btnIcs').addEventListener('click', () => {
        const list = exams.filter(e => filter === 'all' || e.program === filter);
        V.downloadICS(list, 'exam_schedule.ics');
    });
    document.getElementById('btnPrint').addEventListener('click', () => window.print());

    render();
    setInterval(render, 30000);
})();
</script>
</body>
</html>
