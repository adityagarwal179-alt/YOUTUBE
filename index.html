<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Academic Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(22, 28, 45, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #00f2ff;
            --accent-gradient: linear-gradient(135deg, #00f2ff, #0066ff);
            --warning: #ff9f43;
            --danger: #ff4757;
            --success: #2ed573;
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); min-height: 100vh; padding: 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }

        .navbar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); backdrop-filter: blur(12px); padding: 12px 24px; border-radius: 14px; border: 1px solid var(--card-border); margin-bottom: 24px; gap: 10px; flex-wrap: wrap; }
        .nav-link { color: var(--accent); font-weight: 600; text-decoration: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; transition: color 0.2s ease; }
        .nav-link:hover { color: #fff; }
        .btn-action { background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid var(--card-border); padding: 6px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; font-family: inherit; }
        .btn-action:hover { background: var(--accent); color: #000; }

        h1 { text-align: center; font-size: 2.2rem; font-weight: 700; margin-bottom: 16px; background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

        /* Next exam hero */
        .hero { background: linear-gradient(135deg, rgba(0,242,255,0.12), rgba(0,102,255,0.12)); border: 1px solid rgba(0,242,255,0.3); border-radius: 16px; padding: 20px 24px; margin-bottom: 20px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: center; }
        .hero-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); font-weight: 600; }
        .hero-title { font-size: 1.35rem; font-weight: 700; }
        .hero-sub { font-size: 0.85rem; color: var(--text-muted); }
        .hero-count { font-family: monospace; font-size: 1.3rem; font-weight: 700; color: var(--accent); text-align: right; }
        .hero-count small { display: block; font-family: 'Inter', sans-serif; font-size: 0.75rem; color: var(--warning); font-weight: 600; }

        /* Clash alert */
        .alert { background: rgba(255, 71, 87, 0.12); border: 1px solid rgba(255, 71, 87, 0.45); border-left: 4px solid var(--danger); border-radius: 12px; padding: 14px 18px; margin-bottom: 20px; font-size: 0.88rem; }
        .alert strong { color: var(--danger); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.8rem; }
        .alert p + p { margin-top: 8px; }
        .alert[hidden] { display: none; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 14px; border-radius: 12px; text-align: center; }
        .stat-value { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .overall { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px 18px; margin-bottom: 24px; }
        .overall-head { display: flex; justify-content: space-between; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        .bar-bg { height: 8px; background: rgba(255,255,255,0.06); border-radius: 20px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, #00f2ff, #2ed573); transition: width .6s ease; }

        .venues { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 24px; }
        .venue { background: var(--card-bg); border: 1px solid var(--card-border); border-left: 4px solid var(--accent); border-radius: 14px; padding: 16px 18px; }
        .venue.pharm { border-left-color: var(--success); }
        .venue-title { font-size: 0.78rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
        .venue.pharm .venue-title { color: var(--success); }
        .venue-name { font-size: 0.92rem; margin: 6px 0 4px; font-weight: 600; }
        .venue-meta { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 10px; }
        .center-link { display: inline-flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--warning); font-weight: 600; text-decoration: none; background: rgba(255,159,67,0.1); border: 1px solid rgba(255,159,67,0.3); padding: 6px 12px; border-radius: 8px; transition: all .3s ease; }
        .center-link:hover { background: rgba(255,159,67,0.25); color: #fff; border-color: var(--warning); }

        .controls-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
        .search-input { flex: 1; min-width: 180px; background: var(--card-bg); border: 1px solid var(--card-border); padding: 10px 16px; border-radius: 10px; color: var(--text-main); outline: none; font-size: 0.9rem; font-family: inherit; }
        .filter-select { background: #121a2b; border: 1px solid var(--card-border); color: var(--text-main); padding: 10px 16px; border-radius: 10px; outline: none; font-size: 0.9rem; cursor: pointer; font-family: inherit; }
        .empty { text-align: center; color: var(--text-muted); padding: 30px; display: none; }

        .card { background: var(--card-bg); backdrop-filter: blur(12px); border-radius: 16px; padding: 24px; margin-bottom: 24px; border: 1px solid var(--card-border); box-shadow: 0 15px 35px rgba(0,0,0,0.3); transition: border-color .2s ease; }
        .card:hover { border-color: rgba(0,242,255,0.3); }
        .card.is-clash { border-color: rgba(255,71,87,0.5); }
        .card.is-completed { opacity: .72; }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--card-border); gap: 15px; flex-wrap: wrap; }
        .subject-title { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .subject-title input { accent-color: var(--accent); width: 18px; height: 18px; }
        .subject-name { font-weight: 500; color: var(--text-muted); font-size: 0.95rem; }
        .badge-container { display: flex; gap: 10px; flex-wrap: wrap; }
        .badge { padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; }
        .exam-date-box { background: rgba(255,71,87,0.15); color: var(--danger); border: 1px solid rgba(255,71,87,0.3); }
        .time-alert-box { background: rgba(255,159,67,0.15); color: var(--warning); border: 1px solid rgba(255,159,67,0.3); }

        .meta-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
        .chip { font-size: 0.74rem; padding: 4px 10px; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: var(--text-muted); text-decoration: none; }
        .chip.prog-bca { color: var(--accent); border-color: rgba(0,242,255,0.3); }
        .chip.prog-pharm { color: var(--success); border-color: rgba(46,213,115,0.3); }
        .chip.reach { color: var(--warning); border-color: rgba(255,159,67,0.3); }
        a.chip:hover { color: #fff; border-color: var(--accent); }
        .clash-tag { display: none; font-size: 0.78rem; font-weight: 700; color: var(--danger); background: rgba(255,71,87,0.12); border: 1px solid rgba(255,71,87,0.4); padding: 6px 12px; border-radius: 8px; margin-bottom: 14px; }

        .card-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .card-countdown { display: inline-block; background: rgba(0,0,0,0.4); color: var(--accent); padding: 6px 12px; border-radius: 8px; font-weight: 600; font-family: monospace; font-size: 0.85rem; border: 1px solid var(--card-border); }
        .card-countdown.live { color: var(--warning); border-color: rgba(255,159,67,0.4); }
        .card-countdown.done { color: var(--danger); border-color: rgba(255,71,87,0.3); }
        .cal-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .cal-btn { background: rgba(46,213,115,0.1); color: var(--success); border: 1px solid rgba(46,213,115,0.3); padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; text-decoration: none; transition: all .2s ease; cursor: pointer; font-family: inherit; }
        .cal-btn:hover { background: var(--success); color: #000; }

        .box { background: rgba(0,0,0,0.25); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px; margin-bottom: 16px; }
        .box-header { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .topic-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
        .topic-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
        .topic-item input { accent-color: var(--accent); }
        .topic-item .del { margin-left: auto; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; line-height: 1; }
        .topic-item .del:hover { color: var(--danger); }
        .topic-empty { font-size: 0.82rem; color: var(--text-muted); }
        .add-row { display: flex; gap: 8px; margin-top: 10px; }
        .add-row input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); color: var(--text-main); border-radius: 8px; padding: 6px 10px; font-size: 0.82rem; outline: none; font-family: inherit; }
        .add-row button { background: rgba(255,255,255,0.06); color: var(--text-main); border: 1px solid var(--card-border); border-radius: 8px; padding: 6px 12px; font-size: 0.78rem; font-weight: 600; cursor: pointer; font-family: inherit; }
        .add-row button:hover { background: var(--accent); color: #000; }

        .url-updater { display: flex; gap: 10px; margin-bottom: 16px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 10px; border: 1px solid var(--card-border); }
        .url-updater input { flex: 1; background: transparent; border: none; color: var(--text-main); padding: 6px 10px; font-size: 0.85rem; outline: none; font-family: inherit; min-width: 0; }
        .url-updater button { background: var(--accent); color: #000; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: 700; font-family: inherit; }
        .url-updater button.sec { background: rgba(255,255,255,0.08); color: var(--text-main); }
        .url-updater button:hover { opacity: .85; }
        .video-box { width: 100%; aspect-ratio: 16/9; background: rgba(0,0,0,0.4); border-radius: 12px; overflow: hidden; margin-bottom: 16px; border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 0.9rem; }
        .video-box.exam-expired { color: var(--danger); font-weight: 700; letter-spacing: .5px; }
        iframe { width: 100%; height: 100%; border: none; }

        .kit-item { display: flex; align-items: flex-start; gap: 8px; font-size: 0.84rem; margin-bottom: 6px; }
        .kit-item input { accent-color: var(--success); margin-top: 4px; }

        textarea { width: 100%; height: 85px; background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); color: var(--text-main); border-radius: 10px; padding: 12px; resize: vertical; font-size: 0.85rem; font-family: inherit; outline: none; transition: border-color .2s ease; }
        textarea:focus { border-color: var(--accent); }
        input[type="file"] { display: none; }

        @media (max-width: 640px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .hero-count { text-align: left; }
            h1 { font-size: 1.8rem; }
        }
        @media print { .navbar, .url-updater, .controls-bar, .add-row, .cal-group { display: none !important; } body { background: #fff; color: #000; } }
    </style>
</head>
<body>
<div class="container">
    <nav class="navbar">
        <div style="display:flex; gap:16px; flex-wrap:wrap;"><a href="datesheet.html" class="nav-link">Date Sheet →</a><a href="datesheet.html#admitCards" class="nav-link">Admit Cards &amp; Instructions →</a></div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn-action" id="btnAllIcs">📅 All Exams (.ics)</button>
            <button class="btn-action" id="btnExport">Export Backup</button>
            <button class="btn-action" id="btnImport">Import Backup</button>
            <input type="file" id="importFile" accept=".json">
        </div>
    </nav>

    <h1>Master Study Vault</h1>

    <div class="hero" id="hero" hidden></div>
    <div class="alert" id="clashAlert" hidden></div>

    <div class="stats-grid">
        <div class="stat-card"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total Subjects</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-pending">0</div><div class="stat-label">Pending Exams</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-completed">0</div><div class="stat-label">Completed</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-revision">0%</div><div class="stat-label">Revision Done</div></div>
    </div>

    <div class="overall">
        <div class="overall-head"><span>Exam Season Progress</span><span id="overall-text">0% Completed</span></div>
        <div class="bar-bg"><div class="bar-fill" id="overall-fill"></div></div>
    </div>

    <div class="venues" id="venues"></div>

    <div class="controls-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search by subject code or name...">
        <select id="programFilter" class="filter-select">
            <option value="all">All Programmes</option>
            <option value="bca">BCA · IGNOU</option>
            <option value="pharm">Pharmacy · PSBTE</option>
        </select>
        <select id="statusFilter" class="filter-select">
            <option value="all">All Exams</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
        </select>
    </div>

    <div id="cards"></div>
    <div class="empty" id="emptyMsg">No exams match your filters.</div>
</div>

<script src="exams.js"></script>
<script>
(function () {
    'use strict';
    const V = window.VAULT;
    const $ = id => document.getElementById(id);
    const store = V.store;
    const exams = V.sorted();
    const clashList = V.clashes();
    const clashIds = new Set();
    clashList.forEach(([a, b]) => { clashIds.add(a.id); clashIds.add(b.id); });

    // ---------- Rendering ----------
    function renderVenues() {
        $('venues').innerHTML = Object.keys(V.PROGRAMS).map(k => {
            const p = V.PROGRAMS[k];
            return `<div class="venue ${k}">
                <div class="venue-title">${p.label} Examination Centre</div>
                <div class="venue-name">📍 ${p.centre}</div>
                <div class="venue-meta">${p.board}<br>${p.holder}${p.centreCode ? ' · Centre Code ' + p.centreCode : ''}</div>
                <a class="center-link" href="${p.map}" target="_blank" rel="noopener">Open in Maps ↗</a>
            </div>`;
        }).join('');
    }

    function cardHTML(e) {
        const p = V.PROGRAMS[e.program];
        const reach = p.reportMin ? `<span class="chip reach">🚪 Reach by ${V.fmt12(V.shiftTime(e.start, -p.reportMin))}</span>` : '';
        return `
        <div class="card" id="card-${e.id}" data-id="${e.id}" data-program="${e.program}" data-search="${(e.code + ' ' + e.name + ' ' + p.label).toLowerCase()}">
            <div class="header-row">
                <div class="subject-title">
                    <input type="checkbox" id="chk-${e.id}" title="Mark revision complete">
                    <span>${e.code}${e.name ? ' <span class="subject-name">· ' + e.name + '</span>' : ''}</span>
                </div>
                <div class="badge-container">
                    <div class="badge time-alert-box">⏰ ${V.timeRange(e)}</div>
                    <div class="badge exam-date-box">${V.fmtDate(e.date)} | ${V.dayName(e.date)}</div>
                </div>
            </div>
            <div class="meta-row">
                <span class="chip prog-${e.program}">${p.label}</span>
                <span class="chip">${e.cls}</span>
                <span class="chip">${p.mode}</span>
                <a class="chip" href="${p.map}" target="_blank" rel="noopener">📍 ${p.short}</a>
                ${reach}
            </div>
            <div class="clash-tag" id="clash-${e.id}"></div>
            <div class="card-actions">
                <div class="card-countdown" id="cd-${e.id}">Calculating remaining time...</div>
                <div class="cal-group">
                    <a class="cal-btn" href="${V.googleCalUrl(e)}" target="_blank" rel="noopener">📅 Google Calendar</a>
                    <button class="cal-btn" data-ics="${e.id}">⬇ .ics</button>
                    <a class="cal-btn" href="${V.ADMIT_CARDS[e.program].file}" download="${V.ADMIT_CARDS[e.program].downloadName}">🎫 Admit Card</a>
                </div>
            </div>
            <div class="box">
                <div class="box-header"><span>Key Unit Progress</span><span id="prog-${e.id}">—</span></div>
                <div class="topic-list" id="topics-${e.id}"></div>
                <div class="add-row">
                    <input type="text" id="addin-${e.id}" placeholder="Add a unit / topic..." maxlength="120">
                    <button data-add="${e.id}">+ Add</button>
                </div>
            </div>
            <div class="box">
                <div class="box-header"><span>Exam-Day Checklist</span><span id="kitprog-${e.id}">0/${p.checklist.length}</span></div>
                <div id="kit-${e.id}"></div>
            </div>
            <div class="url-updater">
                <input type="text" placeholder="Paste YouTube Link..." id="in-${e.id}">
                <button data-setvid="${e.id}">SET VIDEO</button>
                <button class="sec" data-clearvid="${e.id}">CLEAR</button>
            </div>
            <div class="video-box" id="vid-${e.id}">No resource attached</div>
            <textarea id="txt-${e.id}" placeholder="Write key revision questions for ${e.code}..."></textarea>
        </div>`;
    }

    // ---------- Topics ----------
    function getTopics(e) {
        const raw = store.get('topics_' + e.id);
        if (raw) {
            try { const a = JSON.parse(raw); if (Array.isArray(a)) return a; } catch (_) {}
        }
        // defaults (also reads older backups that used syll_<code>_<idx>)
        return e.topics.map((t, i) => ({ t, d: store.get(`syll_${e.id}_${i}`) === 'true' }));
    }
    function saveTopics(e, arr) { store.set('topics_' + e.id, JSON.stringify(arr)); }

    function renderTopics(e) {
        const box = $('topics-' + e.id);
        const arr = getTopics(e);
        box.innerHTML = '';
        if (!arr.length) {
            const d = document.createElement('div');
            d.className = 'topic-empty';
            d.textContent = 'No topics yet — add your units below to track progress.';
            box.appendChild(d);
        }
        arr.forEach((item, idx) => {
            const label = document.createElement('label');
            label.className = 'topic-item';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = !!item.d;
            cb.addEventListener('change', () => { arr[idx].d = cb.checked; saveTopics(e, arr); updateProgress(e, arr); updateRevisionStat(); });
            const span = document.createElement('span');
            span.textContent = item.t;
            const del = document.createElement('button');
            del.className = 'del'; del.type = 'button'; del.title = 'Remove'; del.textContent = '×';
            del.addEventListener('click', ev => {
                ev.preventDefault();
                arr.splice(idx, 1); saveTopics(e, arr); renderTopics(e);
            });
            label.append(cb, span, del);
            box.appendChild(label);
        });
        updateProgress(e, arr);
    }

    function updateProgress(e, arr) {
        const el = $('prog-' + e.id);
        if (!arr.length) { el.textContent = '—'; return; }
        const done = arr.filter(x => x.d).length;
        el.textContent = Math.round(done / arr.length * 100) + '%';
    }

    function addTopic(e) {
        const input = $('addin-' + e.id);
        const text = input.value.trim();
        if (!text) return;
        const arr = getTopics(e);
        arr.push({ t: text, d: false });
        saveTopics(e, arr);
        input.value = '';
        renderTopics(e);
        updateRevisionStat();
    }

    function updateRevisionStat() {
        let total = 0, done = 0;
        exams.forEach(e => { const a = getTopics(e); total += a.length; done += a.filter(x => x.d).length; });
        $('stat-revision').textContent = total ? Math.round(done / total * 100) + '%' : '—';
    }

    // ---------- Checklist ----------
    function renderKit(e) {
        const p = V.PROGRAMS[e.program];
        const box = $('kit-' + e.id);
        box.innerHTML = '';
        const refresh = () => {
            const n = p.checklist.filter((_, i) => store.get(`kit_${e.id}_${i}`) === 'true').length;
            $('kitprog-' + e.id).textContent = `${n}/${p.checklist.length}`;
        };
        p.checklist.forEach((txt, i) => {
            const label = document.createElement('label');
            label.className = 'kit-item';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = store.get(`kit_${e.id}_${i}`) === 'true';
            cb.addEventListener('change', () => { store.set(`kit_${e.id}_${i}`, cb.checked); refresh(); });
            const s = document.createElement('span'); s.textContent = txt;
            label.append(cb, s);
            box.appendChild(label);
        });
        refresh();
    }

    // ---------- Video ----------
    function extractYouTubeId(url) {
        if (!url) return null;
        try {
            const u = new URL(url.trim());
            const host = u.hostname.replace(/^www\.|^m\./, '');
            let id = null;
            if (host === 'youtu.be') id = u.pathname.slice(1).split('/')[0];
            else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
                if (u.searchParams.get('v')) id = u.searchParams.get('v');
                else {
                    const m = u.pathname.match(/^\/(embed|shorts|live)\/([\w-]{11})/);
                    if (m) id = m[2];
                }
            }
            return id && /^[\w-]{11}$/.test(id) ? id : null;
        } catch (_) { return null; }
    }
    function showVideo(e, id) {
        const box = $('vid-' + e.id);
        if (box.classList.contains('exam-expired')) return;
        if (id) box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}" allowfullscreen loading="lazy" title="Study video"></iframe>`;
        else box.textContent = 'No resource attached';
    }
    function setVideo(e) {
        if (V.status(e) === 'completed') { alert('This exam is completed! Video updates are disabled.'); return; }
        const input = $('in-' + e.id);
        const id = extractYouTubeId(input.value);
        if (!id) { alert('Invalid YouTube link. Please paste a standard YouTube video URL.'); return; }
        showVideo(e, id);
        input.value = '';
        store.set('vid_' + e.id, id);
    }
    function clearVideo(e) {
        try { localStorage.removeItem('vid_' + e.id); } catch (_) {}
        showVideo(e, null);
    }

    // ---------- Persisted state ----------
    let noteTimer = {};
    function loadState(e) {
        const chk = store.get('check_' + e.id);
        if (chk !== null) $('chk-' + e.id).checked = chk === 'true';
        const notes = store.get('notes_' + e.id);
        if (notes !== null) $('txt-' + e.id).value = notes;
        const vid = store.get('vid_' + e.id);
        if (vid && /^[\w-]{11}$/.test(vid)) showVideo(e, vid);
        renderTopics(e);
        renderKit(e);
    }
    function bindEvents(e) {
        $('chk-' + e.id).addEventListener('change', ev => store.set('check_' + e.id, ev.target.checked));
        $('txt-' + e.id).addEventListener('input', ev => {
            clearTimeout(noteTimer[e.id]);
            const v = ev.target.value;
            noteTimer[e.id] = setTimeout(() => store.set('notes_' + e.id, v), 300);
        });
        $('addin-' + e.id).addEventListener('keydown', ev => { if (ev.key === 'Enter') addTopic(e); });
        $('in-' + e.id).addEventListener('keydown', ev => { if (ev.key === 'Enter') setVideo(e); });
    }

    // ---------- Clash display ----------
    function renderClashes() {
        const now = new Date();
        const active = clashList.filter(([a, b]) => V.status(a, now) !== 'completed' && V.status(b, now) !== 'completed');
        const alertBox = $('clashAlert');
        if (!active.length) { alertBox.hidden = true; }
        else {
            alertBox.hidden = false;
            alertBox.innerHTML = '<strong>⚠ Exam timetable clash detected</strong>' + active.map(([a, b]) =>
                `<p><b>${V.fmtDate(a.date)}</b>: <b>${V.label(a)}</b> (${V.timeRange(a)}, ${V.PROGRAMS[a.program].short}) overlaps with ` +
                `<b>${V.label(b)}</b> (${V.timeRange(b)}, ${V.PROGRAMS[b.program].short}). ` +
                `These are two different boards and two different venues — contact your institute and the IGNOU Regional Centre now to arrange a resolution.</p>`
            ).join('');
        }
        exams.forEach(e => {
            const tag = $('clash-' + e.id);
            const card = $('card-' + e.id);
            const others = clashList.filter(pair => pair.includes(e) && !pair.some(x => V.status(x, now) === 'completed'))
                .map(pair => pair.find(x => x !== e));
            if (others.length) {
                tag.style.display = 'block';
                tag.textContent = '⚠ Time clash with ' + others.map(V.label).join(', ');
                card.classList.add('is-clash');
            } else {
                tag.style.display = 'none';
                card.classList.remove('is-clash');
            }
        });
    }

    // ---------- Live tick ----------
    function tick() {
        const now = new Date();
        let completed = 0;
        let next = null;
        exams.forEach(e => {
            const st = V.status(e, now);
            const card = $('card-' + e.id);
            const cd = $('cd-' + e.id);
            const vid = $('vid-' + e.id);
            card.dataset.status = st === 'completed' ? 'completed' : 'pending';
            card.classList.toggle('is-completed', st === 'completed');
            if (st === 'completed') {
                completed++;
                cd.textContent = '🏁 COMPLETED';
                cd.className = 'card-countdown done';
                if (!vid.classList.contains('exam-expired')) {
                    vid.innerHTML = '🏁 EXAM COMPLETED';
                    vid.classList.add('exam-expired');
                }
            } else if (st === 'live') {
                cd.textContent = '🟠 IN PROGRESS — ends in ' + V.fmtDur(V.examEnd(e) - now);
                cd.className = 'card-countdown live';
                if (!next) next = e;
            } else {
                cd.textContent = '⏳ Time Remaining: ' + V.fmtDur(V.examStart(e) - now);
                cd.className = 'card-countdown';
                if (!next) next = e;
            }
        });

        $('stat-total').textContent = exams.length;
        $('stat-completed').textContent = completed;
        $('stat-pending').textContent = exams.length - completed;
        const pct = exams.length ? Math.round(completed / exams.length * 100) : 0;
        $('overall-fill').style.width = pct + '%';
        $('overall-text').textContent = `${pct}% Completed (${exams.length - completed} Remaining)`;

        const hero = $('hero');
        if (next) {
            const p = V.PROGRAMS[next.program];
            const live = V.status(next, now) === 'live';
            hero.hidden = false;
            const reach = p.reportMin ? `Reach by ${V.fmt12(V.shiftTime(next.start, -p.reportMin))}` : '';
            hero.innerHTML = `<div>
                    <div class="hero-label">${live ? 'Exam in progress' : 'Next exam'}</div>
                    <div class="hero-title">${V.label(next)}</div>
                    <div class="hero-sub">${V.fmtDate(next.date)} · ${V.dayName(next.date)} · ${V.timeRange(next)}<br>📍 ${p.centre}</div>
                </div>
                <div class="hero-count">${live ? V.fmtDur(V.examEnd(next) - now) : V.fmtDur(V.examStart(next) - now)}<small>${live ? 'until it ends' : reach}</small></div>`;
        } else {
            hero.hidden = false;
            hero.innerHTML = '<div><div class="hero-label">Status</div><div class="hero-title">🎉 All exams completed!</div></div>';
        }
        renderClashes();
        applyFilter();
    }

    function applyFilter() {
        const q = $('searchInput').value.toLowerCase().trim();
        const prog = $('programFilter').value;
        const st = $('statusFilter').value;
        let shown = 0;
        document.querySelectorAll('.card').forEach(card => {
            const ok = card.dataset.search.includes(q)
                && (prog === 'all' || card.dataset.program === prog)
                && (st === 'all' || card.dataset.status === st);
            card.style.display = ok ? 'block' : 'none';
            if (ok) shown++;
        });
        $('emptyMsg').style.display = shown ? 'none' : 'block';
    }

    // ---------- Backup ----------
    const KEY_RE = /^(check_|notes_|vid_|topics_|syll_|kit_|ins_|ac_)/;
    function exportData() {
        const dump = {};
        try {
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (KEY_RE.test(k)) dump[k] = localStorage.getItem(k);
            }
        } catch (_) {}
        const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `academic_vault_backup_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    function importData(ev) {
        const file = ev.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (evt) {
            try {
                const parsed = JSON.parse(evt.target.result);
                if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('bad');
                let n = 0;
                Object.keys(parsed).forEach(k => {
                    if (KEY_RE.test(k) && typeof parsed[k] === 'string') { store.set(k, parsed[k]); n++; }
                });
                exams.forEach(loadState);
                updateRevisionStat();
                alert(`Backup restored successfully (${n} items).`);
            } catch (_) { alert('Invalid backup file format!'); }
            ev.target.value = '';
        };
        reader.readAsText(file);
    }

    // ---------- Init ----------
    renderVenues();
    $('cards').innerHTML = exams.map(cardHTML).join('');
    exams.forEach(e => { bindEvents(e); loadState(e); });
    updateRevisionStat();

    $('cards').addEventListener('click', ev => {
        const t = ev.target.closest('button');
        if (!t) return;
        if (t.dataset.ics) { const e = V.byId(t.dataset.ics); V.downloadICS([e], `${e.code}_exam.ics`); }
        else if (t.dataset.add) addTopic(V.byId(t.dataset.add));
        else if (t.dataset.setvid) setVideo(V.byId(t.dataset.setvid));
        else if (t.dataset.clearvid) clearVideo(V.byId(t.dataset.clearvid));
    });
    $('btnAllIcs').addEventListener('click', () => V.downloadICS(exams, 'all_exams.ics'));
    $('btnExport').addEventListener('click', exportData);
    $('btnImport').addEventListener('click', () => $('importFile').click());
    $('importFile').addEventListener('change', importData);
    ['searchInput', 'programFilter', 'statusFilter'].forEach(id => {
        $(id).addEventListener(id === 'searchInput' ? 'input' : 'change', applyFilter);
    });

    tick();
    setInterval(tick, 1000);
})();
</script>
</body>
</html>
